name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      # next build's own TypeScript pass generates .next/types (route
      # helper types like LayoutProps) as it goes; a standalone tsc
      # --noEmit run before that exists fails with "Cannot find name
      # 'LayoutProps'" on a clean checkout, so generate it explicitly first.
      - run: npx next typegen
      - run: npx tsc --noEmit

      - name: Test
        run: npm run test:cov

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

      - run: npm run build
